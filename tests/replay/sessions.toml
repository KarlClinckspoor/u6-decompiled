# spellbook whose current spell is Heal and the reagents. Cast, then click Tiberius on the map
# (tile 4,5 of the view: pixel 72,88): SPELL_CastFromBook casts the book's spell at him and
# TakeReagents decrements SpellPageCounts[26], a byte of BSS 18 bytes past the 8-byte array.
