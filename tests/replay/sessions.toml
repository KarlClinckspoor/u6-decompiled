# The healer's resurrection (docs/CODE_REVIEW.md, CR-005): the party east of Tiberius (NPC 26, in
# his house, set to his shop mode 90h so that he offers at once), the Avatar carrying a creature's
# corpse (quality E5h, a temporary slot) and then NPC 6's (NPC 6 dead), and 1,000 gold among
# the four. Talk, yes: Tiberius walks the object chain from the Avatar and raises the first body,
# slot E5h (its HP becomes 1); NPC 6 stays dead and he offers again for "another slain friend";
# no, bye
# Burying a moonstone (the port's moonstone-guard enhancement, docs/port/FIXES.md): the Avatar on
# grass with the moonstone of phase 3. Use it from the inventory: buried there, MoonstonePos[3]
# set. With --enhance moonstone-guard the game asks first ("Bury the moonstone here?"); the
# port_keys answer N, then use it again (the slot cursor stays on it) and answer Y
[moonstone]
feed = 40
setup = ["teleport 309 379 0", "give avatar 0x49 0 0 3"]
keys = "u tab right right enter space space"
port_keys = "2000:u 2800:tab 3600:right 4400:right 5200:enter 6000:n 6800:space 7600:u 8400:tab 9200:enter 10000:y 10800:space"

