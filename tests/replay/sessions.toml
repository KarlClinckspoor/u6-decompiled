# script must not contain it.

# a minute of the opening fight (gargoyles in the throne room, from the staged saved game): moves,
# a look north, a talk attempt and typed words the game answers with "what?", passes
[smoke]
keys = "left down down right l up enter t down enter n a m e enter j o b enter enter esc space space space space"
