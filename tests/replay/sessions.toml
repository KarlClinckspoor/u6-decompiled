# Character creation, before every session: U.EXE (the real one, from the game directory) run in
# DOSBox-X from a fresh copy of the game, typed by tools/keyfeed.py's KEYFEED.COM. It counts in
# U.EXE's own keyboard polls, not in time: KEY/N is offered after N calls of kbhit that said "no
# key" since the last key was read (default `gap`), so every run reads the same key in the same
# frame. It also gives U.EXE a fixed date and time, the seed of the gypsy's shuffles (srand(time(0))).
# tools/rp.py checks the OBJLIST against objlist_sha1 and fails on any other.
[_chargen]
# made: Avatar, male, the first male portrait; strength 17, dexterity 20, intelligence 22
# (answers A: the lower virtue of each pair, so Honesty wins the last question)
u_sha1 = "b6cde9fb239d56656777ad52adbe1324315b65ac"      # the U.EXE it was made with
objlist_sha1 = "01572292630827a62cfdfabb0018f7db2f2b2951"
date = "1990-06-01"
time = "12:00:00"
gap = 30
keys = "esc/5 c/40 t:Avatar/20 enter/20 m/20 c/40 space/60 space/60 space/60 space/60 space/60 space/60 space/60 a/40 a/40 a/40 a/40 a/40 a/40 a/40 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60"
