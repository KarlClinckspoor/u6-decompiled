# Key scripts for tools/rp.py record and check (docs/replay.md). Every session starts from the
# character [_chargen] makes (below). rp.py sends the stop key, F9, after the last key; a script
# must not contain it.

# Sessions with `feed` are typed by tools/keyfeed.py's KEYFEED.COM (mode bios), loaded high before
# GAME.EXE: KEY/N is offered after N polls of the keyboard that said "no key" since the last key
# was read (default `feed`), and the clock reads 1990-01-01 12:00:00 (so GAME's seed is fixed).
# The run is then the same on every host and every time, and keys like ctrl+s can be typed.
# Names: tools/keyfeed.py (esc enter space left right up down home end pageup pagedown f1..f10,
# one character as typed, ctrl+X, alt+X, t:TEXT). A session without `feed` is typed in real time
# by DOSBox-X's AUTOTYPE (its names, `wait` and `pace` seconds), which loses keys now and then
# (tests/replay/README.md).

# a minute of the opening fight (gargoyles in the throne room): moves, a look north, a talk
# attempt and typed words the game answers with "what?", passes
[smoke]
feed = 30
keys = "left down down right l up enter t down enter n a m e enter j o b enter enter esc space space space space"

# the first real session (PLAN-exact-port.md, task 8; its recording is first.rec): a talk with
# Dupre (to the Avatar's lower right) asking name, job and join, then bye; the Avatar's
# inventory (F1) and the party again (F10); a look at Lord British (four tiles up); combat (b)
# with six attacks north; six steps south, out of the throne room; ten turns passed; the game
# saved (ctrl+s, Y). All four survive and the gargoyles die
[first]
feed = 40
keys = "t pagedown enter t:name enter t:job enter t:join enter t:bye enter space/60 f1/60 f1/60 f10/60 l up up up up enter b a up enter a up enter a up enter a up enter a up enter a up enter down down down down down down space space space space space space space space space space ctrl+s Y"

# A session that starts from an edited saved game (`setup`: tools/u6save.py's commands, applied to
# the character by tools/rp.py's session_stage; DOS and the port start from the same files): the
# party teleported to the first moongate's place, far from the castle (another area file, with
# their belongings), 100 gold coins (object 58h) for the Avatar, the Avatar's strength 30,
# Dupre's level 6, karma 99, noon. Then steps, the inventory (F1), the party (F10), passes and
# the game saved (ctrl+s, Y)
[setup]
feed = 40
setup = ["teleport 0x3A7 0x106 0", "give avatar 0x58 100", "npc avatar str 30", "npc Dupre level 6",
         "set KARMA 99", "set Time_H 12"]
keys = "down down left left up f1/60 f1/60 f10/60 space space space space ctrl+s Y"

# Combat at a shrine the gargoyles hold (PLAN-exact-port.md, Phase 3): the one at (503, 359),
# its egg at (503, 361). The party starts 10 tiles east, on grass at (513, 361): loading the save
# builds the area, and the egg, more than 8 tiles off and out of sight, hatches (egg.c's
# EGG_hatchArea). The Avatar gets a readied spellbook with Magic Arrow (11h) and Fireball (22h)
# and reagents (black pearl, blood moss, sulfurous ash). Melee (Dupre, Shamino, the Avatar's
# attack), ranged (Iolo's crossbow), the Avatar's Magic Arrow (the target cursor starts on the
# caster: three tiles west), the winged gargoyles' own spells; then passes and the game saved.
# What happens (tests/replay/shrine.rec): a gargoyle killed, Dupre paralyzed, Dupre and Shamino
# killed, then the Avatar: the resurrection at Lord British's castle (307, 352), experience and
# magic points lost, and the game saved there
[shrine]
feed = 40
setup = ["teleport 513 361 0", "give avatar 0x39 0 0 0 equip", "put 0x3A 0 0x11", "put 0x3A 0 0x22",
         "give avatar 0x41 20", "give avatar 0x42 20", "give avatar 0x48 20"]
keys = "space space space space space space c enter left left left enter space space space space space space space space a left enter space space space space space space space space space space ctrl+s Y"

# The jailed drake at the mage Rudyom's house (PLAN-exact-port.md, Phase 3): an egg (100%, one
# drake) at (569, 340), in a cell walled north and west and barred east and south, so no one can
# stand next to it. The party starts in the yard at (575, 350), more than 8 tiles off, so the egg
# hatches as the save loads. The Avatar trades the sword for a halberd (reach 2, still melee:
# combat.c's WeaponRanges), and a cannon (0DDh) stands at (571, 340) facing west (frame 3). Six
# steps north and four west to the steel door at (571, 343); use (it opens); in, to (571, 341);
# fire the cannon (use, north; blocked by the bars, it explodes on the drake's tile:
# objcmd.c's UseCannon); attack with the halberd (target two west, one north) six times, the
# cannon again between; passes; the game saved
[drake]
feed = 40
setup = ["teleport 575 350 0", "unequip avatar 0x2B", "give avatar 0x2F 0 0 0 equip", "place 0xDD 571 340 0 0 0 3 behind"]
keys = "up up up up up up left left left left u up up up up u up space a left left up enter space a left left up enter space u up space a left left up enter space a left left up enter space a left left up enter space a left left up enter space space space space ctrl+s Y"

# The endgame (PLAN-exact-port.md, Phase 3): the Codex at (923, 851), in its chamber at the Shrine
# of Singularity. The party starts on the carpet at (923, 856), the Avatar with the Britannia lens
# (18Ah), the Gargoyle lens (18Ch) and the vortex cube (3Eh) holding the eight moonstones (49h,
# frames 0..7). Up three, left two, up to (921, 852): drop the Britannia lens north, on
# (921, 851) (Drop: the inventory's slot cursor two right to the lens, then the map cursor up).
# Right four to (925, 852): drop the Gargoyle lens north, on (925, 851). Use (Tab to the
# inventory, where the slot cursor is on the cube) the cube: objcmd.c's UseVortexCube finds the
# moonstones, the lenses and the Codex within 5 tiles; "The Codex has vanished!", a key, and
# LaunchEndGame, where HOOK_EXEC ends the session before GAME runs END.EXE (the ending, Phase 4)
[endgame]
feed = 40
setup = ["teleport 923 856 0", "give avatar 0x18A 0", "give avatar 0x18C 0", "give avatar 0x3E 0",
         "put 0x49 0 0 0", "put 0x49 0 0 1", "put 0x49 0 0 2", "put 0x49 0 0 3",
         "put 0x49 0 0 4", "put 0x49 0 0 5", "put 0x49 0 0 6", "put 0x49 0 0 7"]
keys = "up up up left left up d right right enter up enter right right right right d right right enter up enter u tab enter space space"

# The fountain (docs/CODE_REVIEW.md, CR-008): UseFountain compares the wish with 10 entries of a
# 5-entry table. In DOS entries 5 and 6 point at zero bytes (DS:0100, DS:0101), so an empty wish
# matches; the port gives "" past the table (u6port.h's FOUNTAIN_WISH). The party at (309, 379),
# below the castle courtyard's fountain at (309, 378): an empty wish, a wish no entry matches,
# then "food" three times (each a 1 in 5 chance of a portion of meat)
[fountain]
feed = 40
setup = ["teleport 309 379 0"]
keys = "u up Y enter space u up Y t:xyz enter space u up Y t:food enter space u up Y t:food enter space u up Y t:food enter space"

# A purchase (docs/CODE_REVIEW.md, CR-009): Max the blacksmith (NPC 18) in Britain, at (348, 378)
# at noon. His script's lists fill $0, $1 and $Y from arrays: string LETs from an array, whose
# OP_DATA has one operand and reads and writes lstack[-1] (talkdr.c's parse_factor; the port
# gives it a slot of its own). The party two tiles south at (348, 380), 200 gold for the Avatar;
# talk (the cursor two up), "buy", "weap", the Avatar (1) buys a dagger (1), yes, "bye"
[shop]
feed = 40
setup = ["teleport 348 380 0", "set Time_H 12", "give avatar 0x58 200"]
keys = "t up up enter t:buy enter t:weap enter 1 1 y space t:bye enter space space"

# The endgame with potions instead of moonstones (docs/CODE_REVIEW.md, CR-001): UseVortexCube
# only checks that the cube holds items of frames 0 to 7, and the cube takes any item dropped
# onto it on the ground (CanPutInContainer refuses the spellbook and dead bodies, not the cube;
# only putting it in from the inventory refuses non-moonstones; a port trial dropped six potions
# into the cube that way). Setup: the lenses in place (921, 851) and (925, 851), the cube on
# the carpet at (923, 852) holding eight potions (113h, frames 0 to 7, one of each colour) and
# no moonstone. Up three to (923, 853); use the cube (north). If the claim holds, the Codex
# vanishes and the session ends at HOOK_EXEC
[potions]
feed = 40
setup = ["teleport 923 856 0", "place 0x18A 921 851 0", "place 0x18C 925 851 0", "place 0x3E 923 852 0",
         "put 0x113 0 0 0", "put 0x113 0 0 1", "put 0x113 0 0 2", "put 0x113 0 0 3",
         "put 0x113 0 0 4", "put 0x113 0 0 5", "put 0x113 0 0 6", "put 0x113 0 0 7"]
keys = "up up up u up enter space space"

# Map transitions by ladder: the castle's northwest tower ladder at (291, 347). The party at
# (291, 348) uses it (north): map.c's PartyChangeLevel takes it down to level 1, the coordinates
# scaled (surface chunk / 4, the same tile in the chunk) to (75, 83, 1), where an up ladder
# stands; waits; uses that ladder (Use, Enter on its own tile) back up to (291, 347, 0); waits
[ladders]
feed = 40
setup = ["teleport 291 348 0"]
keys = "u up enter space space u enter space space"

# Entering a dungeon by walking onto its entrance: the mine shaft at (234, 409) (dungeon 6). The
# walk-on test (npctrack.c) returns at once in combat mode, which the saved game starts in, so b
# breaks combat off first; north onto the shaft, down to (58, 97, 1), where an up ladder stands;
# waits; that ladder back up to (234, 409, 0)
[dungeon]
feed = 40
setup = ["teleport 234 410 0"]
keys = "b up space space space u enter space space"

# Character creation, before every session: U.EXE (the real one, from the game directory) run in
# DOSBox-X from a fresh copy of the game, typed by tools/keyfeed.py's KEYFEED.COM. It counts in
# U.EXE's own keyboard polls, not in time: KEY/N is offered after N calls of kbhit that said "no
# key" since the last key was read (default `gap`), so every run reads the same key in the same
# frame. It also gives U.EXE a fixed date and time, the seed of the gypsy's shuffles (srand(time(0))).
# tools/rp.py checks the OBJLIST against objlist_sha1 and fails on any other.
[_chargen]
# made: Avatar, male, the first male portrait; strength 17, dexterity 20, intelligence 22
# (answers A: the lower virtue of each pair, so Honesty wins the last question)
u_sha1 = "b6cde9fb239d56656777ad52adbe1324315b65ac"      # the U.EXE it was made with
objlist_sha1 = "01572292630827a62cfdfabb0018f7db2f2b2951"
date = "1990-06-01"
time = "12:00:00"
gap = 30
keys = "esc/5 c/40 t:Avatar/20 enter/20 m/20 c/40 space/60 space/60 space/60 space/60 space/60 space/60 space/60 a/40 a/40 a/40 a/40 a/40 a/40 a/40 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60 esc/60"
