# Exhume's configuration for Ultima VI's GAME.EXE (exhume/docs/config.md). For now only the
# replay tools read it: exhume/tools/replay.py's build, dos, compare, show and log, through
# tools/rp.py (docs/replay.md). The DOS gate is still tools/gate.py, not Exhume's.

[project]
name = "u6"
root = "."
src = "SRC"
include = "SRC"
build = "build"

[toolchain]
profile = "borland-tc20"
c_opts = "-d -mm -p -Z -O"       # SRC/MAKEFILE's switches for GAME's medium-model files

[replay]
magic = "U6GR"                   # rpgame.h's RP_MAGIC_TAG
exe_name = "GAME.EXE"
work = "dos/replay"              # build/dos/replay: the replay build, and runs without an OUT
sessions = "tests/replay"
# the user's own copy of the game (not in the repository): the directory the DOS runs stage as C:\
data = "${U6_GAMEDATA:-gamedata}"
# left out of that copy: the GOG release's own DOSBox, its launcher and uninstaller, the manual
data_skip = ["DOSBOX", "cloud_saves", "webcache.zip", "manual.pdf", "unins000.exe", "unins000.dat",
             "dosboxULTIMA6.conf", "dosboxULTIMA6_single.conf"]
dosbox_conf = "tests/replay/dosbox-x.conf"   # replays (replaydos.mjs) and recordings (tools/rp.py)
# the saved game every run starts from is not in the repository: tools/rp.py chargen makes it with
# the real U.EXE ([_chargen] in tests/replay/sessions.toml) into build/dos/replay/stage, and passes
# it as --stage
# Exhume's replay build is the modding link, which this project does not have: the replay
# build swaps OSILIB's MOUSE and DELAY for MOUSERP and DELAYRP, adds STACKRP and rpfar.asm, and
# fails if DGROUP moved (tools/rpbuild.py)
build = "{python} tools/rpbuild.py --out {work}"
shared_opts = "-d -mm -p -Z -O -DRP_FAR_STORAGE"
# rpgame.h's RP_STOP_KEY: F9 (143h). KBD_GetKey's int 16h function 0 never gives F11 or F12,
# the game uses F1..F8 and F10. tools/rp.py record sends it after the keys; replaydos.mjs
# (a js-dos recording) sends this
stop_key = "F9"
keystate_len = 1                 # rpgame.h's RP_KEYSTATE_LEN
# the replay build's own switches passed into DOS when set (runtime/replay/replay.c)
env = ["UWRPCK", "UWRPTRACE", "UWRPFULL", "UWRPHOOK"]
# the DOS environment, set in this order in the batch before the program, in every DOS (js-dos,
# DOSBox-X; replaydos.mjs --dos-set, tools/rp.py record): js-dos's own variables. The program's
# environment block is a copy of the shell's, and Turbo C's start-up sizes the near heap by it
# (__ENVLNG, environ, ___BRKLVL), so a recording made in one DOS replays in the other with the
# same DGROUP. Together with tests/replay/dosbox-x.conf's [dos] settings, which load GAME at
# js-dos's segment (docs/replay.md, "js-dos and DOSBox-X")
dos_env = ["PROMPT=", "PATH=Z:\\", "COMSPEC=Z:\\COMMAND.COM", "BLASTER=A220 I7 D1 H5 T6"]
out_files = ["RECORD.OUT", "STATE.OUT", "TRACE.OUT"]
# the saved game a session leaves (the game's own save, Ctrl+S then Y, writes OBJLIST and the
# OBJBLK files there): replaydos.mjs and tools/rp.py record copy it out of every run, and
# replay.py saves A B (tools/rp.py check) compares two runs' file for file
saves = ["SAVEGAME"]

# SEGS (rpgame.h): 30 words, DGROUP first, then the far heap blocks (FarHeap, Mem_BP, the
# drivers, the game's blocks). DGROUP is EXE paragraph 329Bh in the replay build (RGAME.MAP);
# DGROUP and the code segments the game keeps in far function pointers move with the load
# segment; everything from DGROUP's 64 KB up (429Bh) is the far heap, whose words are counted
# from FarHeap (SEGS word 1, heap_block): the graphics driver's tile cache keeps the segment of
# each page of GrMemory, 305Eh paragraphs above FarHeap in DOS (749Bh) and in the port (405Eh).
# replay.py applies that rule only to words in exe_range, so the range runs from the load
# segment up to the top of conventional memory (A000h less the PSP and the load segment, with
# room): the heap is above the EXE here, not inside it. The port has no DGROUP and writes 0 for
# it (port/game/rpport.c). Only a comparison of DOS with the port uses these (Phase 2): two DOS
# runs are compared with --same-build.
[replay.segments]
first_block_para = 0x329B
exe_range = [0x0000, 0x9E00]
heap_block = 1

# rpgame.h's masks: bytes of a section that are the program's machinery, not game state.
# lo inclusive, hi exclusive. None of them is zeroed in the dump.
[[replay.mask]]
section = "DATA"
lo = 0x98
hi = 0x9C
scope = "always"
why = "C0's __STARTTIME, the BIOS tick count at start-up (for clock(), which GAME does not link); different in every run"

[[replay.mask]]
section = "MDRV"
lo = 0x0C
hi = 0x162
scope = "always"
why = "U6ADLIB.DRV's variables (port/sys/adlib.c names them), stepped by its 60 Hz int 8 handler whenever it comes; another music driver has its own layout"

[[replay.mask]]
section = "STAK"
lo = 4
hi = 6
scope = "always"
why = "STACKRP's lowest stack address written: interrupts push wherever SP is when they come; a measurement, not state"

[[replay.mask]]
section = "NULL"
lo = 0x8B
hi = 0x8F
scope = "always"
why = "the int 16h vector (NULL holds DS:0..30h, the checksum word, then the vector table from 33h): in a recording typed by tools/keyfeed.py's KEYFEED.COM it points into KEYFEED, in a replay at the BIOS. The game neither sets nor reads it"

[[replay.mask]]
section = "NULL"
lo = 0xB7
hi = 0xBB
scope = "always"
why = "the int 21h vector: KEYFEED.COM's in a recording (it gives the program a fixed date and time, so a fixed seed), DOS's in a replay. The game neither sets nor reads it"
